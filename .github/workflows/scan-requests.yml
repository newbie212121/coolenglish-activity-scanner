# .github/workflows/scan-requests.yml

name: Nightly Activity Request Scan

on:
  schedule:
    - cron: "0 6 * * *"   # 6:00 AM UTC = 2:00 AM EDT
  workflow_dispatch:
    inputs:
      days:
        description: "Days back to scan"
        required: false
        default: "1"
      recluster:
        description: "Re-cluster all (true/false)"
        required: false
        default: "false"

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic requests python-dotenv

      - name: Run scanner
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          DAYS="${{ github.event.inputs.days || '1' }}"
          RECLUSTER="${{ github.event.inputs.recluster || 'false' }}"
          ARGS="--days $DAYS --output requests.json"
          if [ "$RECLUSTER" = "true" ]; then ARGS="$ARGS --recluster"; fi
          python scanner.py $ARGS

      - name: Build email summary
        id: summary
        run: |
          python - <<'EOF'
          import json, os

          data = json.load(open("requests.json"))
          clusters = data.get("clusters", [])
          requests = data.get("requests", [])
          total = data.get("total", 0)
          updated = data.get("last_updated", "")[:10]

          # Build plain-text email body
          lines = []
          lines.append("=" * 50)
          lines.append("  COOL ENGLISH — ACTIVITY REQUEST SUMMARY")
          lines.append("=" * 50)
          lines.append(f"  Date: {updated}")
          lines.append(f"  Total requests on file: {total}")
          lines.append("")
          lines.append("TOP REQUESTED ACTIVITY THEMES:")
          lines.append("-" * 50)

          for i, c in enumerate(clusters, 1):
              lines.append(f"\n#{i}  {c['emoji']}  {c['theme']}  —  {c['count']} request(s)")
              for ex in c.get("examples", [])[:3]:
                  lines.append(f"     • {ex}")
              teachers = c.get("teachers", [])
              if teachers:
                  lines.append(f"     Teachers: {', '.join(teachers[:3])}")

          lines.append("\n" + "=" * 50)
          lines.append("View full data: https://github.com/${{ github.repository }}/blob/main/requests.json")
          lines.append("=" * 50)

          body = "\n".join(lines)

          # Write to file for next step
          with open("email_body.txt", "w") as f:
              f.write(body)

          # Also set as output
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"total={total}\n")
              top = clusters[0]["theme"] if clusters else "None"
              f.write(f"top_theme={top}\n")

          print(body)
          EOF

      - name: Send email summary
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.zoho.com
          server_port: 587
          username: ${{ secrets.ZOHO_EMAIL }}
          password: ${{ secrets.ZOHO_SMTP_PASSWORD }}
          subject: "🌟 Cool English Activity Requests — ${{ steps.summary.outputs.total }} total | Top: ${{ steps.summary.outputs.top_theme }}"
          to: john@coolenglish.net
          from: Cool English Scanner <${{ secrets.ZOHO_EMAIL }}>
          body: file://email_body.txt

      - name: Commit results
        run: |
          git config user.name "Cool English Bot"
          git config user.email "bot@coolenglish.com"
          git add requests.json
          git diff --staged --quiet || git commit -m "🤖 Scan: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Job Summary
        run: |
          echo "### 📊 Scan Complete" >> $GITHUB_STEP_SUMMARY
          python -c "
          import json
          data = json.load(open('requests.json'))
          print(f'**Total:** {data[\"total\"]} requests')
          print(f'**Updated:** {data[\"last_updated\"]}')
          print()
          for i,c in enumerate(data['clusters'][:5],1):
              print(f'{i}. {c[\"emoji\"]} {c[\"theme\"]} — {c[\"count\"]}x')
          " >> $GITHUB_STEP_SUMMARY
